<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="burgundy" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b1a2b" />
      <stop offset="70%" stop-color="#5a0e1c" />
      <stop offset="100%" stop-color="#34050f" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0" />
      <stop offset="25%" stop-color="#f0cb75" />
      <stop offset="60%" stop-color="#c59837" />
      <stop offset="100%" stop-color="#eec366" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Burgundy Wax Seal Base -->
  <circle cx="32" cy="32" r="30.5" fill="url(#burgundy)" />

  <!-- Outer Gold Beaded / Solid Rim -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#gold)" stroke-width="2.2" />
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#f5deb3" stroke-width="0.8" stroke-dasharray="1.5 2" opacity="0.85" />

  <!-- Intertwined Wedding Rings Emblem -->
  <g filter="url(#shadow)">
    <!-- Left Ring (Groom) -->
    <circle cx="25.5" cy="32" r="11" fill="none" stroke="url(#gold)" stroke-width="3" />
    
    <!-- Right Ring (Bride) -->
    <circle cx="38.5" cy="32" r="11" fill="none" stroke="url(#gold)" stroke-width="3" />
    
    <!-- Ring Overlap Mask Arc -->
    <path d="M 29.5 22 A 11 11 0 0 1 34.5 26" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />

    <!-- Solitaire Diamond on Bride's Ring -->
    <polygon points="38.5,19 41.5,15 38.5,11 35.5,15" fill="#ffffff" stroke="url(#gold)" stroke-width="0.8" />
    
    <!-- Diamond Sparkle Accent -->
    <line x1="38.5" y1="8" x2="38.5" y2="10" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
    <line x1="33" y1="15" x2="34.5" y2="15" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" />
    <line x1="42.5" y1="15" x2="44" y2="15" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" />

    <!-- Center Love Heart in Wedding Knot -->
    <path d="M 32 30.5 C 30.5 28.5 28 28.5 26.8 30 C 25.2 32 26 34.5 32 38.5 C 38 34.5 38.8 32 37.2 30 C 36 28.5 33.5 28.5 32 30.5 Z" fill="#b91c1c" stroke="url(#gold)" stroke-width="0.8" />
    
    <!-- Royal Dots Top & Bottom -->
    <circle cx="32" cy="7" r="1.5" fill="url(#gold)" />
    <circle cx="32" cy="53" r="1.5" fill="url(#gold)" />
  </g>
</svg>
